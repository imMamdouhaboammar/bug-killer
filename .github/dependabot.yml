# Version-update policy for the maintained Bug Killer components.
# Security updates are intentionally ungrouped, never ignored, and require review.
# Enabling Dependabot alerts/security updates is a separate repository setting.
version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/services/inspector"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gomod"
    directories:
      - "/services/orchestrator"
      - "/services/healer"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
