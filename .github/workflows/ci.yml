name: Bug Killer CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-rust:
    name: Rust Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap protobuf-compiler && sudo chmod u+s /usr/bin/bwrap || true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Rust Check & Format
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Rust Workspace Tests
        run: cargo test --workspace --verbose
      - name: Inspector Quality Gate
        run: |
          cd services/inspector
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --verbose

  test-go:
    name: Go Microservices Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap libpcap-dev protobuf-compiler && sudo chmod u+s /usr/bin/bwrap || true
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/orchestrator/go.mod
          cache-dependency-path: |
            services/orchestrator/go.sum
            services/healer/go.sum
      - name: Test Orchestrator
        run: |
          cd services/orchestrator
          go vet ./...
          go test -v ./...
      - name: Test Healer
        run: |
          cd services/healer
          go vet ./...
          go test -v ./...

  test-python:
    name: Python CVE MCP Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/cve-mcp-server/pyproject.toml
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio anyio pytest-httpx respx
          cd services/cve-mcp-server
          pip install -e ".[test]"
      - name: Run Ruff Format & Lint Check
        run: |
          cd services/cve-mcp-server
          ruff check .
          ruff format --check .
      - name: Run Deterministic Offline Test Suite
        run: |
          cd services/cve-mcp-server
          pytest -m "not online" -v

  end-to-end-integration:
    name: E2E Integration & Verification
    needs: [test-rust, test-go, test-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/orchestrator/go.mod
          cache-dependency-path: |
            services/orchestrator/go.sum
            services/healer/go.sum
      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap libpcap-dev protobuf-compiler && sudo chmod u+s /usr/bin/bwrap || true
      - name: Full System Build
        run: |
          make build
          git diff --exit-code completions/
      - name: Run Full Test Suite
        run: make test

  lat-knowledge-graph:
    name: Lat.md Knowledge Graph Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Verify Lat Knowledge Graph
        run: bunx --bun @lat.md/core check

  docker-smoke:
    name: Docker Build & Smoke Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker Final Stage
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: final
          load: true
          tags: bug-killer:smoke
      - name: Run CLI Entrypoint Smoke Test (Read-only)
        run: |
          echo "==> Testing default CLI --version..."
          docker run --rm bug-killer:smoke --version
          echo "==> Testing default CLI --help..."
          docker run --rm bug-killer:smoke --help
      - name: Verify Runtime Binaries and Permissions
        run: |
          echo "==> Verifying binary presence..."
          docker run --rm --entrypoint /bin/sh bug-killer:smoke -c "
            test -x /app/bug-killer || exit 1
            test -x /app/bk || exit 1
            test -x /app/bug-killer-inspector || exit 1
            test -x /app/bug-killer-orchestrator || exit 1
            test -x /app/bug-killer-healer || exit 1
            echo '[+] All expected service binaries exist and are executable'
          "
      - name: Verify Unprivileged Runtime Execution
        run: |
          UID_VAL=$(docker run --rm --entrypoint /usr/bin/id bug-killer:smoke -u)
          if [ "$UID_VAL" -eq 0 ]; then
            echo "[-] Error: Container unexpectedly running as root (UID 0)"
            exit 1
          fi
          echo "[+] Verified unprivileged runtime user UID: $UID_VAL"
