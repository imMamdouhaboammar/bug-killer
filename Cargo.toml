[package]
name = "bug-killer"
version = "0.1.0"
edition = "2024"
authors = ["Mamdouh Aboammar <mamdouhfces1997@gmail.com>"]
description = "Autonomous Vulnerability Discovery & Self-Healing Engine for Deep and Ghosty Bugs"
license-file = "LICENSE"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
semver = "1.0"
thiserror = "2.0"
anyhow = "1.0"
rustyline = "19.0"
colored = "3.0"
tabled = "0.17"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
regex = "1.11"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.17"
ureq = { version = "3.5.0", features = ["json"] }
goblin = "0.9"
memmap2 = "0.9"
ast-grep-core = "0.51"
ast-grep-language = { version = "0.51", default-features = false, features = ["tree-sitter-python", "tree-sitter-javascript", "tree-sitter-typescript", "tree-sitter-php", "tree-sitter-go", "tree-sitter-rust"] }
tree-sitter = "0.27"
