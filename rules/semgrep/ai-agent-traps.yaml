rules:
  - id: bk-semgrep-ai-prompt-injection-sink
    patterns:
      - pattern-either:
          - pattern: |
              $PROMPT = $PROMPT + $UNTRUSTED;
              ...
              $CLIENT.complete($PROMPT)
          - pattern: |
              $PROMPT += $UNTRUSTED
              ...
              $CLIENT.chat($PROMPT)
    message: "Untrusted variable concatenated into prompt before invoking model completion."
    languages: [python, javascript, typescript]
    severity: WARNING
    metadata:
      cwe: "CWE-20"
      category: "ai-security"
      confidence: MEDIUM

  - id: bk-semgrep-ai-raw-model-eval
    patterns:
      - pattern-either:
          - pattern: eval($RESP.text)
          - pattern: eval($RESP.content)
          - pattern: exec($OUTPUT)
          - pattern: subprocess.run($OUTPUT, shell=True)
    message: "Model generation output fed directly into language evaluation or shell execution."
    languages: [python, javascript]
    severity: ERROR
    metadata:
      cwe: "CWE-94"
      category: "ai-security"
      confidence: HIGH
