[package]
name = "bug-killer-inspector"
version = "0.1.0"
edition = "2024"
authors = ["Mamdouh Aboammar <mamdouhfces1997@gmail.com>"]
license-file = "../../LICENSE"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
regex = "1.11"
sha2 = "0.11"
walkdir = "2.5"
goblin = "0.10"
chrono = "0.4"
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = "0.12"
prost = "0.13"
async-stream = "0.3"
tower = { version = "0.4", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rig = { package = "rig-core", version = "0.45.0", features = ["reqwest"] }
thiserror = "2.0"

[build-dependencies]
tonic-build = "0.12"
